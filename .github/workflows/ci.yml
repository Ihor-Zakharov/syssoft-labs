name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['labwatch/**', '**/*.md']
  pull_request:
    paths-ignore: ['labwatch/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    # Windows: later labs use WinForms, the registry and LocalDB
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build, test and check format of every lab
        shell: pwsh
        run: |
          $solutions = Get-ChildItem -Path . -Filter 'Lab*.slnx' -Recurse -Depth 1
          if (-not $solutions) { throw 'No Lab*.slnx found' }
          foreach ($sln in $solutions) {
            Write-Host "::group::$($sln.Name)"
            dotnet build $sln.FullName -c Release -warnaserror
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            dotnet test $sln.FullName -c Release --no-build --logger trx --results-directory TestResults
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            dotnet format $sln.FullName --verify-no-changes --no-restore
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
