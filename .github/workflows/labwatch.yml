name: labwatch

on:
  push:
    branches: [main]
    paths: ['labwatch/**', '.github/workflows/labwatch.yml']
  pull_request:
    paths: ['labwatch/**', '.github/workflows/labwatch.yml']

permissions:
  contents: read

concurrency:
  group: labwatch-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: labwatch

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The SQL tests of the status page (uptime buckets) run against a real Postgres
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: labwatch
          POSTGRES_DB: labwatch
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U labwatch -d labwatch"
          --health-interval 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in labwatch/package.json
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: labwatch/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: labwatch/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: docker image (${{ matrix.image.name }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: collector, dockerfile: services/collector/Dockerfile }
          - { name: gateway, dockerfile: services/gateway/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: labwatch
          file: labwatch/${{ matrix.image.dockerfile }}
          push: false
          tags: labwatch-${{ matrix.image.name }}:ci
          # Layer cache in GitHub's cache service: unchanged dependency layers are not rebuilt
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
