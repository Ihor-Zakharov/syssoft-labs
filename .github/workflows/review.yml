name: Code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are not available to Dependabot and fork PRs
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The repository contains university lab assignments in C# / .NET 10.
            Focus on correctness bugs, resource leaks (IDisposable, HttpClient), security (TLS/certificate
            handling, SQL injection, secrets in code), error handling and missing or weak tests.
            Skip style nitpicks that `dotnet format` already enforces.

            Leave inline comments on specific lines for concrete issues, then post one short summary
            comment on the PR. If there are no real issues, say so briefly. Write in English.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
