name: Code review

# Runs once when a PR is opened or marked ready. To review again after new commits,
# add the "review" label to the PR (remove and re-add it for every next round).
on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are not available to Dependabot and fork PRs
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The repository contains university lab assignments in C# / .NET 10
            and a TypeScript monitoring tool (labwatch/).

            Work efficiently:
            - Start from `gh pr diff`. Review the changed lines; open other files only to confirm a suspected issue.
            - Do not build, run or test anything: CI already does that.

            Focus on correctness bugs, resource leaks, security (TLS/certificate handling, SQL injection,
            secrets in code, container and network exposure), error handling and missing or weak tests.
            Skip style nitpicks that formatters already enforce.

            Leave inline comments on specific lines for concrete issues, then post one short summary
            comment on the PR. If there are no real issues, say so briefly. Write in English.
          claude_args: >-
            --max-turns 25
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
