server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS: re-resolve "gateway" so a restarted gateway container (new IP) is found again
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /trpc/ {
        set $gateway http://gateway:3000;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Server-sent events: pass every event through immediately and keep the stream open
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed file names: safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
